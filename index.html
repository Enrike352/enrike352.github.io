<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planchas SM</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <h1 class="titulo mb-4">PLANCHAS SM</h1>
        <div class="marco_busqueda mb-4">
            <div class="d-flex justify-content-center gap-3">
                <select class="busqueda form-select border-secondary-subtle shadow-sm " name="curso" id="curso">
                    <option value="">Seleccionar Curso</option>
                </select>
                <select class="busqueda form-select border-secondary-subtle shadow-sm" name="docente" id="docente">
                    <option value="">Seleccionar Docente</option>
                </select>
                <button class="btn_buscar btn btn-primary" name="buscar" id="btnBuscar">Buscar</button>

                <button class="btn btn-outline-secondary" id="btnLimpiar">Limpiar</button>
            </div>
        </div>
        <div id="resultados">
            <table class="table table-striped table-bordered table-hover">
                <thead class="table-dark">
                    <tr>
                        <th>Curso</th>
                        <th>Docente</th>
                        <th>Tipo Examen</th>
                        <th>Ciclo</th>
                        <th>Periodo</th>
                        <th>Fecha</th>
                        <th>Archivo</th>
                    </tr>
                </thead>
                <tbody id="tabla_body"></tbody>
            </table>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
